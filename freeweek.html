<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your Free Week | Lone Star Institute of Taekwondo</title>
    <meta
      name="description"
      content="Claim your free week of Taekwondo classes at Lone Star Institute of Taekwondo."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/css/reset_and_variables.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
      body.freeweek-page {
        background:
          linear-gradient(180deg, #ffffff 0%, #f7f7f8 55%, #f0f1f3 100%);
      }

      .freeweek {
        min-height: 100vh;
        padding: calc(var(--spacing-xl) * 1.4) var(--spacing-lg)
          calc(var(--spacing-xl) * 2);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--spacing-xl) * 1.1);
        text-align: center;
      }

      .freeweek__header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-md);
        width: 100%;
        max-width: 540px;
      }

      .freeweek__logo {
        width: 100%;
        max-width: 210px;
        height: auto;
      }

      .freeweek__cta {
        width: 100%;
        max-width: 320px;
      }

      .freeweek__helper {
        font-family: Arial, sans-serif;
        font-size: clamp(1rem, 2vw, 1.1rem);
        color: var(--text-medium);
      }

      .freeweek__form {
        width: 100%;
        display: flex;
        justify-content: center;
        scroll-margin-top: var(--spacing-lg);
      }

      .freeweek__card {
        width: min(100%, 520px);
      }

      .freeweek__form-fields {
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing-sm) * 0.85);
      }

      .freeweek__form .lead-capture__submit,
      .freeweek__return {
        width: 100%;
      }

      .freeweek__status {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .freeweek__status p {
        margin: 0;
      }


      @media (min-width: 768px) {
        .freeweek {
          padding-top: calc(var(--spacing-xl) * 1.8);
        }
      }
    </style>
  </head>
  <body class="freeweek-page">
    <main class="freeweek">
      <header class="freeweek__header">
        <img
          src="/img/lsit_logo.svg"
          class="freeweek__logo"
          alt="Lonestar Institute of Taekwando"
        >
        <p class="freeweek__helper">
          Fill out the form to claim your free week of class today.
        </p>
      </header>

      <section id="free-week-form" class="freeweek__form" aria-label="Claim your free week">
        <div class="lead-capture__card freeweek__card">
          <form
            id="lead-form"
            name="Free Week Lead Form - Website"
            class="lead-capture__form"
            action="/freeweek-success.html"
            method="post"
            data-netlify="true"
            aria-describedby="lead-capture-disclaimer"
            data-netlify-honeypot="bot-field"
          >
            <input type="hidden" name="form-name" value="Free Week Lead Form - Website">
            <p class="visually-hidden">
              <label>
                Do not fill this field if you are human.
                <input type="text" name="bot-field" tabindex="-1" autocomplete="off">
              </label>
            </p>
            <div class="freeweek__form-fields" data-lead-fields>
              <div class="lead-capture__field">
                <label class="lead-capture__micro-label" for="lead-name">Name</label>
                <input
                  type="text"
                  id="lead-name"
                  name="name"
                  placeholder="John Smith"
                  autocomplete="name"
                  required
                >
              </div>
              <div class="lead-capture__field">
                <label class="lead-capture__micro-label" for="lead-phone">Phone</label>
                <input
                  type="tel"
                  id="lead-phone"
                  name="phone"
                  placeholder="(555) 123-4567"
                  autocomplete="tel"
                  inputmode="tel"
                  required
                >
              </div>
              <div class="lead-capture__field">
                <label class="lead-capture__micro-label" for="lead-email">Email</label>
                <input
                  type="email"
                  id="lead-email"
                  name="email"
                  placeholder="john@example.com"
                  autocomplete="email"
                  required
                >
              </div>
              <div class="lead-capture__consent">
                <input type="checkbox" id="lead-consent" name="consent">
                <label for="lead-consent">Keep me updated on offers and classes.</label>
              </div>
              <button type="submit" class="lead-capture__submit">CLAIM FREE WEEK</button>
              <p id="lead-capture-disclaimer" class="lead-capture__disclaimer">
                By submitting, you agree to receive promotional messages from Lonestar
                Institute of Taekwando. Reply STOP to opt out. Msg &amp; data rates may
                apply. See our <a href="/privacy.html">Privacy Policy</a>.
              </p>
            </div>
          </form>
        </div>
      </section>
    </main>

  </body>
</html>
