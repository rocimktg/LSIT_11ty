<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Free Week Submitted | Lone Star Institute of Taekwondo</title>
    <meta
      name="description"
      content="Thanks for claiming your free week at Lone Star Institute of Taekwondo."
    >
    <meta http-equiv="refresh" content="10;url=/index.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/css/reset_and_variables.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
      body.freeweek-page {
        background:
          linear-gradient(180deg, #ffffff 0%, #f7f7f8 55%, #f0f1f3 100%);
      }

      .freeweek {
        min-height: 100vh;
        padding: calc(var(--spacing-xl) * 1.4) var(--spacing-lg)
          calc(var(--spacing-xl) * 2);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--spacing-xl) * 1.1);
        text-align: center;
      }

      .freeweek__header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--spacing-md);
        width: 100%;
        max-width: 540px;
      }

      .freeweek__logo {
        width: 100%;
        max-width: 210px;
        height: auto;
      }

      .freeweek__form {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .freeweek__card {
        width: min(100%, 520px);
      }

      .freeweek__return {
        width: 100%;
      }

      .freeweek__status {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .freeweek__status p {
        margin: 0;
      }

      .freeweek__countdown {
        font-family: Arial, sans-serif;
        font-size: 0.95rem;
        color: rgba(7, 12, 24, 0.6);
      }

      @media (min-width: 768px) {
        .freeweek {
          padding-top: calc(var(--spacing-xl) * 1.8);
        }
      }
    </style>
    <script src="/js/freeweek-success.js" defer></script>
  </head>
  <body class="freeweek-page">
    <main class="freeweek">
      <header class="freeweek__header">
        <img
          src="/img/lsit_logo.svg"
          class="freeweek__logo"
          alt="Lonestar Institute of Taekwondo"
        >
      </header>

      <section class="freeweek__form" aria-label="Free week submission success">
        <div class="lead-capture__card freeweek__card">
          <div class="lead-capture__status lead-capture__status--success freeweek__status">
            <p>We will reach back out to you soon. Thanks for filling out the form.</p>
            <p class="freeweek__countdown" data-countdown data-countdown-start="10">
              Redirecting to the main website in
              <span data-countdown-value>10</span> seconds.
            </p>
            <a class="hero__button hero__button--tertiary freeweek__return" href="/index.html">
              Go to Main Website
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
